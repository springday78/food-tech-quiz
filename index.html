<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Script Logic -->
    <script>
        var ALL = [
            // [1주차] (9문항)
            { wk: "1주차", title: "글로벌 식량 위기의 이해", q: "축산업에서 소고기 1kg을 생산하기 위해 소요되는 물의 양으로 제시된 수치는 얼마입니까?", o: ["150리터", "1,500리터", "15,000리터", "150,000리터"], a: 2, e: "정답: ③\n평가: 특정 식량 생산에 투입되는 가상수(Virtual Water)의 막대한 비중을 이해하고 있는지 확인합니다." },
            { wk: "1주차", title: "글로벌 식량 위기의 이해", q: "'농업(Agriculture)'과 '인플레이션(Inflation)'의 합성어로, 농산물 가격 폭등이 일반 물가 상승과 사회 불안으로 이어지는 현상을 무엇이라 합니까?", o: ["스테그플레이션(Stagflation)", "애그플레이션(Agflation)", "푸드플레이션(Foodflation)", "에코플레이션(Ecoflation)"], a: 1, e: "정답: ②\n평가: 식량 위기가 경제 및 사회 시스템 전반에 미치는 영향력을 정의하는 전문 용어를 숙지했는지 평가합니다." },
            { wk: "1주차", title: "글로벌 식량 위기의 이해", q: "전 세계 식량 시스템의 실패를 보여주는 지표로, 매년 생산된 식량 중 폐기되는 양의 비중은 약 어느 정도입니까?", o: ["전체의 5% 미만", "전체의 약 10%", "전체의 약 3분의 1(1/3)", "전체의 절반 이상(1/2)"], a: 2, e: "정답: ③\n평가: 식량 부족의 원인이 생산량 절대 부족만이 아니라 분배와 관리 시스템의 실패에 있음을 알고 있는지 평가합니다." },
            { wk: "1주차", title: "글로벌 식량 위기의 이해", q: "버려지는 식품 부산물이나 가치가 낮은 재료에 기술을 더해 새로운 가치를 지닌 먹거리로 재탄생시키는 활동을 무엇이라 합니까?", o: ["다운사이클링(Downcycling)", "업사이클링(Upcycling)", "리사이클링(Recycling)", "쉐어링(Sharing)"], a: 1, e: "정답: ②\n평가: 선형적 소비 구조를 순환적 구조로 바꾸는 핵심 기술 개념을 숙지했는지 평가합니다." },
            { wk: "1주차", title: "글로벌 식량 위기의 이해", q: "강의에서 설명한 '지구 가열화(Heating)'와 작물 수확량의 관계 중 옳은 설명은 무엇입니까?", o: ["기온이 1℃ 상승할 때마다 옥수수 수확량은 약 7.4% 증가한다.", "기온 상승은 사과 재배 한계선을 남쪽으로 이동시킨다.", "단 1℃의 기온 상승만으로도 주곡 작물의 생산성은 급격히 감소한다.", "기후 변화는 농부의 과거 경험 데이터만으로 충분히 예측 가능하다."], a: 2, e: "정답: ③\n평가: 기후 변화가 농업 생산성에 미치는 직접적인 수치와 파급 효과를 알고 있는지 평가합니다." },
            { wk: "1주차", title: "글로벌 식량 위기의 이해", q: "UN의 예측에 따르면 2050년 세계 인구는 약 몇 명에 도달할 것으로 보이며, 이로 인해 발생하는 식량 수요의 변화는 무엇입니까?", o: ["80억 명 - 식량 생산 과잉으로 인한 가격 하락", "100억 명 - 중산층 증가에 따른 육류 수요 급증", "120억 명 - 채식 위주의 식단 변화로 자원 보존", "150억 명 - 인공 식량만으로 모든 수요 충족"], a: 1, e: "정답: ②\n평가: 미래 인구 통계 변화와 그에 따른 식소비 패턴의 상관관계를 이해하고 있는지 평가합니다." },
            { wk: "1주차", title: "글로벌 식량 위기의 이해", q: "외부 환경을 기술적으로 제어하여 기후 위기와 상관없이 안정적인 생산을 가능하게 하는 농업 방식을 무엇이라 합니까?", o: ["노지 재배(Open Field Agriculture)", "환경 제어 농업(CEA) 및 스마트팜", "전통적 유기농업", "수렵 채집형 농업"], a: 1, e: "정답: ②\n평가: 기후 위기를 극복하기 위한 기술적 대안의 핵심 개념을 이해하고 있는지 평가합니다." },
            { wk: "1주차", title: "글로벌 식량 위기의 이해", q: "'푸드테크'의 정의를 가장 올바르게 재정의한 설명은 무엇입니까?", o: ["단순히 더 맛있는 고기를 만드는 조리 기술", "농부의 노동력을 완전히 대체하여 실업을 유발하는 기술", "자원을 순환시키고 낭비를 없애며 분배를 최적화하는 총체적 솔루션", "고가의 식재료를 개발하여 기업의 이윤만을 극대화하는 산업 기술"], a: 2, e: "정답: ③\n평가: 푸드테크를 단순한 식품 가공 기술이 아닌 지속 가능성을 위한 시스템적 도구로 인식하고 있는지 평가합니다." },
            { wk: "1주차", title: "글로벌 식량 위기의 이해", q: "2050년 '시스템 붕괴 위기'를 초래하는 3가지 거대한 파도(퍼펙트 스톰)에 해당하지 않는 것은 무엇입니까?", o: ["폭발적 수요(Demand)", "기후 위기(Climate)", "자원 고갈(Resources)", "기술의 과잉 공급(Technology Surplus)"], a: 3, e: "정답: ④\n평가: 미래 식량 시스템이 직면한 복합적인 위기 요인을 체계적으로 구분할 수 있는지 평가합니다." },

            // [2주차] (9문항)
            { wk: "2주차", title: "식량 시스템과 지속가능성", q: "제품의 생산부터 소비, 폐기까지 전 과정에서 발생하는 온실가스의 총량을 의미하며, 식단 선택의 환경적 영향을 측정하는 핵심 지표는 무엇입니까?", o: ["탄소 발자국 (Carbon Footprint)", "에코 에너지 (Eco Energy)", "그린 지수 (Green Index)", "푸드 시스템 (Food System)"], a: 0, e: "정답: ①\n평가: 환경적 지속가능성을 평가하는 기본 지표인 탄소 발자국의 개념을 정확히 숙지했는지 평가합니다." },
            { wk: "2주차", title: "식량 시스템과 지속가능성", q: "식품이 생산지에서 소비지까지 이동한 총 거리를 의미하며, 이 수치가 높을수록 운송 과정에서의 탄소 배출량이 증가하는 개념은?", o: ["푸드 시스템 (Food System)", "푸드 마일리지 (Food Mileage)", "로컬 루트 (Local Route)", "유통 궤적 (Distribution Track)"], a: 1, e: "정답: ②\n평가: 유통 거리가 환경에 미치는 영향을 설명하는 핵심 용어를 알고 있는지 평가합니다." },
            { wk: "2주차", title: "식량 시스템과 지속가능성", q: "제품의 '원료 채취 - 생산 - 유통 - 사용 - 폐기' 등 전 생애주기가 환경에 미치는 영향을 종합적으로 평가하는 기법은?", o: ["CP (Carbon Pricing)", "LCA (Life Cycle Assessment)", "EMS (Environmental Management System)", "RE100 (Renewable Energy 100)"], a: 1, e: "정답: ②\n평가: 환경 영향 평가의 글로벌 표준 기법인 전과정 평가(LCA)를 알고 있는지 확인합니다." },
            { wk: "2주차", title: "식량 시스템과 지속가능성", q: "현대 식량 시스템의 5단계 공급망 중, 가장 큰 비효율성을 상징하며 전 세계 생산량의 30% 이상이 손실되는 단계는 어디입니까?", o: ["생산 (Production)", "가공 (Processing)", "유통 및 물류 (Distribution)", "폐기 및 재활용 (Waste & Recycling)"], a: 3, e: "정답: ④\n평가: 식량 위기가 단순히 생산량의 문제가 아니라 시스템의 마지막 단계인 '폐기' 과정에서의 비효율성임을 인지하고 있는지 평가합니다." },
            { wk: "2주차", title: "식량 시스템과 지속가능성", q: "농업 생산 단계에서 화학 비료 사용 시 방출되며, 이산화탄소(CO2)보다 훨씬 강력한 온실 효과를 유발하는 기체는 무엇입니까?", o: ["산소 (O2)", "메탄 (CH4)", "아산화질소 (N2O)", "질소 (N2)"], a: 2, e: "정답: ③\n평가: 농업 활동이 기후 변화에 미치는 구체적인 화학적 요인을 파악하고 있는지 평가합니다." },
            { wk: "2주차", title: "식량 시스템과 지속가능성", q: "식량 가치사슬(Value Chain) 내 수익 분배 구조에 대한 설명으로 옳은 것은 무엇입니까?", o: ["농업 생산자가 전체 수익의 약 50% 이상을 가져가는 공정한 구조이다.", "유통 및 브랜드 기업의 수익 비중은 약 10~15% 수준으로 매우 낮다.", "노동 투입량과 수익 분배는 정비례하는 경향을 보인다.", "농업 생산자는 가장 많은 노동을 투입함에도 수익 비중이 10~15%로 가장 낮다."], a: 3, e: "정답: ④\n평가: 식량 산업 내의 경제적 불평등과 수익 구조의 모순을 이해하고 있는지 평가합니다." },
            { wk: "2주차", title: "식량 시스템과 지속가능성", q: "국제 곡물 시장의 시스템적 위험 요소 중 하나인 '공급의 집중화'와 관련하여, 전 세계 식량 공급의 핵심을 차지하는 국가 수와 특징을 바르게 설명한 것은?", o: ["약 50개국에 고르게 분산되어 있어 리스크가 낮다.", "단 5개의 국가에 집중되어 있으며, 소수의 거대 기업이 유통부터 가공까지 독점한다.", "중소 규모의 유통사들이 자유 경쟁을 통해 가격을 결정한다.", "국가의 경계가 무의미하여 지정학적 리스크의 영향을 전혀 받지 않는다."], a: 1, e: "정답: ②\n평가: 글로벌 공급망의 독점 구조와 그로 인한 지정학적 위기 가능성을 이해하는지 평가합니다." },
            { wk: "2주차", title: "식량 시스템과 지속가능성", q: "토양을 소모적인 자원이 아닌 생명체로 대하며, 유기물 증가와 다양한 작물 재배를 통해 토양의 탄소 흡수 능력을 회복시키는 농업 방식은?", o: ["기업농 (Corporate Farming)", "단일 경작 (Monoculture)", "재생 농업 (Regenerative Agriculture)", "대규모 개간 농업 (Land Clearing)"], a: 2, e: "정답: ③\n평가: 기후 위기 대응 모델로서 토양 생태계 회복의 중요성을 이해하는지 평가합니다." },
            { wk: "2주차", title: "식량 시스템과 지속가능성", q: "도심 내 스마트팜과 수직농장의 혁신적 가치(Pros)와 현실적 과제(Cons)를 바르게 짝지은 것은?", o: ["가치: 초기 구축 비용 저렴 - 과제: 기후 영향 많이 받음", "가치: 연중 안정적 생산 가능 - 과제: 막대한 에너지 소비", "가치: 운송 거리 증가 - 과제: 도심 내 생산 불가능", "가치: 토양 생태계 복원 - 과제: 물 사용량 증가"], a: 1, e: "정답: ②\n평가: 기술 기반 농업이 가진 잠재력과 해결해야 할 경제적·에너지적 딜레마를 균형 있게 이해하는지 평가합니다." },

            // [3주차] (9문항)
            { wk: "3주차", title: "푸드테크의 개념과 산업 구조", q: "다음 중 강의에서 설명한 푸드테크(Food Tech)에 대한 설명으로 가장 적절하지 않은 것은?", o: ["식품 산업에 바이오 기술(BT), 인공지능(AI), 로봇 등 4차 산업혁명 기술이 결합된 분야이다.", "단순히 주방의 편리함을 제공하는 가전제품의 성능 개선을 의미하는 용어이다.", "생산부터 소비, 폐기에 이르는 전체 가치사슬에 ICT 기술이 융복합된 신산업이다.", "전통적인 노동 집약적 산업에서 데이터 기반의 지능형 산업으로의 패러다임 전환을 뜻한다."], a: 1, e: "정답: ②\n평가: 푸드테크는 단순한 주방 기계 도입을 넘어 산업 생태계 전체의 혁신을 의미함을 이해해야 합니다." },
            { wk: "3주차", title: "푸드테크의 개념과 산업 구조", q: "강의에서 분류한 푸드테크의 4가지 핵심 영역 중, '식품 유통 분야'의 핵심 경쟁력으로 강조된 기술은 무엇인가?", o: ["세포 배양육 및 정밀 발효 기술", "3D 푸드 프린팅을 활용한 연화식 제조", "콜드체인 시스템과 AI 수요 예측 알고리즘", "IoT 센서를 활용한 정밀농업과 스마트팜"], a: 2, e: "정답: ③\n평가: 유통 분야에서는 신선도 유지를 위한 콜드체인과 효율적 물류 배치를 위한 데이터 분석 능력이 필수적입니다." },
            { wk: "3주차", title: "푸드테크의 개념과 산업 구조", q: "강의에서 설명한 '세포 배양육' 기술에 대한 설명으로 옳은 것을 고르시오.", o: ["식물에서 단백질을 추출하여 고기의 질감을 흉내 내는 1세대 대체육 기술이다.", "미생물의 DNA를 프로그래밍하여 동물 없이 단백질을 생산하는 기술이다.", "동물의 줄기세포를 채취하여 생물반응기 안에서 실제 고기 조직으로 길러낸다.", "콩이나 버섯 등 농산물 부산물을 활용하여 새로운 식재료를 만드는 업사이클링 기술이다."], a: 2, e: "정답: ③\n평가: 세포 배양육과 정밀 발효 기술의 차이점을 명확히 구분하는 것이 중요합니다." },
            { wk: "3주차", title: "푸드테크의 개념과 산업 구조", q: "다음 중 강의에서 언급된 '식품 업사이클링(Upcycling)'의 사례로 적절한 것은?", o: ["스마트팜 온실에서 IoT 센서로 이산화탄소 농도를 조절함.", "가축의 귀에 센서를 부착해 구제역 등의 질병을 조기에 예측함.", "맥주 보리 찌꺼기나 콩 껍질을 활용하여 고농축 에너지바를 제조함.", "3D 푸드 프린터로 고령자를 위한 부드러운 형태의 음식을 인쇄함."], a: 2, e: "정답: ③\n평가: 폐기되던 부산물에 새로운 부가가치를 더해 자원 순환을 실현하는 개념을 파악해야 합니다." },
            { wk: "3주차", title: "푸드테크의 개념과 산업 구조", q: "외식업계에서 조리 및 서빙 로봇 도입이 가속화되는 가장 근본적이고 구조적인 이유로 지목된 것은?", o: ["로봇을 구경하려는 소비자들의 호기심 유발", "정부의 첨단 기술 도입에 대한 강력한 규제 지침", "가파른 인건비 상승과 심각한 구인난 및 3D 업종 기피 현상", "전통적 요리법의 예술성을 보존하기 위한 수단"], a: 2, e: "정답: ③\n평가: 로봇 도입이 단순한 편의성 차원을 넘어 외식업계 생존을 위한 필수 조건이 된 배경을 이해해야 합니다." },
            { wk: "3주차", title: "푸드테크의 개념과 산업 구조", q: "MZ세대의 '미닝아웃(Meaning Out)' 트렌드와 관련하여, 푸드테크가 주목받게 된 배경으로 옳은 것은?", o: ["가파른 인건비 상승을 억제하기 위한 무인 매장 도입 필요성 증대", "전통적 축산업이 배출하는 온실가스 등 환경 문제 해결", "팬데믹 상황에서 타인과의 접촉을 최소화하려는 비대면 서비스 수요", "고령 인구 증가에 따른 질환 맞춤형 메디푸드 시장의 팽창"], a: 1, e: "정답: ②\n평가: 미닝아웃 현상이 환경적 윤리와 결합하여 대체 단백질 기술 발전을 촉발했습니다." },
            { wk: "3주차", title: "푸드테크의 개념과 산업 구조", q: "강의 마지막에 강조한, 푸드테크 생태계를 완성하는 '숨겨진 지휘자' 역할의 요소는 무엇인가?", o: ["고도의 하드웨어를 갖춘 다관절 조리 로봇", "드론과 지상 로봇이 결합된 멀티모달 배송 장비", "친환경 소재로 만든 생분해성 포장재", "데이터를 분석하고 플랫폼화하는 소프트웨어 및 서비스"], a: 3, e: "정답: ④\n평가: 하드웨어보다 이를 제어하고 최적화하는 소프트웨어(AI, 빅데이터, 플랫폼)의 중요성을 인식해야 합니다." },
            { wk: "3주차", title: "푸드테크의 개념과 산업 구조", q: "'개인 맞춤형 식단'의 대중화를 이끄는 학문적 배경이자, 유전자 정보와 식단의 관계를 연구하는 분야는 무엇인가?", o: ["애그테크(Ag-Tech)", "영양유전체학(Nutrigenomics)", "비거니즘(Veganism)", "마이크로 풀필먼트(MFC)"], a: 1, e: "정답: ②\n평가: 개인의 사적인 생체 데이터와 AI 분석이 결합된 정밀 영양 시대의 도래를 이해해야 합니다." },
            { wk: "3주차", title: "푸드테크의 개념과 산업 구조", q: "글로벌 푸드테크 시장의 성장 추이에 대한 설명 중 사실과 다른 것은?", o: ["닛케이BP종합연구소에 따르면 2025년 시장 규모는 약 3,600억 달러에 이를 전망이다.", "이머전 리서치는 2030년까지 연평균 약 6%씩 성장하여 4,347억 달러 규모를 형성할 것으로 내다봤다.", "미국 시장은 전 세계 시장의 엔진 역할을 하고 있으며 2030년 약 672억 달러 규모로 팽창할 전망이다.", "시장 조사 기관마다 수치의 차이는 있으나, 성장 방향성에 대해서는 전문가들 사이에서도 의견이 엇갈리고 있다."], a: 3, e: "정답: ④\n평가: 모든 전문가가 시장의 폭발적인 성장 방향성에 대해서는 만장일치로 동의하고 있음을 인지해야 합니다." },

            // [4주차] (9문항)
            { wk: "4주차", title: "대체단백질 산업의 이해", q: "대체단백질 시장 성장을 견인하는 '3대 메가 동인(Mega Drivers)'에 해당하지 않는 것은?", o: ["인구 증가에 따른 단백질 수요 폭발", "기후 위기에 따른 저탄소 및 자원 효율적 기술 필수화", "바이오 프로세싱 발전에 따른 상업화 비용 절감", "전통 축산업의 생산 단가 하락 및 공급 과잉"], a: 3, e: "정답: ④\n평가: 인구 증가, 기후 위기, 생명공학 혁신이 3대 동인입니다." },
            { wk: "4주차", title: "대체단백질 산업의 이해", q: "세포 배양육(Cultivated Meat) 생산 시 세포가 3차원 형태로 자라날 뼈대 역할을 하는 것은?", o: ["바이오리액터(Bioreactor)", "스캐폴드(Scaffold, 지지체)", "향미제(Flavoring)", "효소 가수분해물"], a: 1, e: "정답: ②\n평가: 세포들이 달라붙어 근육 조직으로 조직화되기 위해서는 스캐폴드라는 뼈대가 필수적입니다." },
            { wk: "4주차", title: "대체단백질 산업의 이해", q: "'압출 성형(Extrusion)' 공정 고도화를 통해 구현하고자 하는 핵심 가치는?", o: ["단백질 함량을 100%까지 높이는 것", "육류 특유의 결대로 찢어지는 섬유질 구조와 식감(Meatiness) 구현", "미생물을 이용해 유전자를 조작하는 것", "제품의 부피를 최대한 크게 팽창시키는 것"], a: 1, e: "정답: ②\n평가: 고도의 열과 압력을 이용해 식물성 원료를 섬유질 고기 구조로 변환하여 씹는 맛을 살립니다." },
            { wk: "4주차", title: "대체단백질 산업의 이해", q: "식물성 단백질 시장의 '성장 정체기' 및 '소비자 이탈'의 가장 주된 원인은 무엇인가?", o: ["제품의 가격이 전통 육류보다 지나치게 저렴해서", "원료인 대두와 완두콩의 수급이 불가능해져서", "소비자가 기대하는 진짜 고기의 맛과 식감을 충족하지 못해서", "유통 기한이 너무 짧아 신선도 유지가 어렵기 때문에"], a: 2, e: "정답: ③\n평가: 맛과 식감의 한계가 소비자 이탈의 본질적인 원인으로 지목되었습니다." },
            { wk: "4주차", title: "대체단백질 산업의 이해", q: "대체육의 영양학적 특성에 대한 비교 분석 중 올바른 설명은?", o: ["전통 소고기보다 콜레스테롤 함량이 월등히 높다.", "제조 과정에서 나트륨이 첨가되지 않아 전통 육류보다 저염식이다.", "식물성 원료의 특성상 포화지방 수치가 전통 육류보다 낮다.", "단백질 생체이용률이 동물성 단백질보다 뛰어나다."], a: 2, e: "정답: ③\n평가: 대체육은 콜레스테롤 제로이고 포화지방이 낮으나, 가공 중 나트륨이 과다 첨가됩니다." },
            { wk: "4주차", title: "대체단백질 산업의 이해", q: "'정밀발효(Precision Fermentation)' 기술의 상업적 성과 중 하나인 '대두 레그헤모글로빈'의 역할은?", o: ["식물성 고기에 부족한 식이섬유를 보충한다.", "단백질의 소화 흡수율을 낮추어 다이어트 효과를 준다.", "고기를 구울 때 배어 나오는 핏물과 육즙의 풍미를 구현한다.", "제품의 유통기한을 인위적으로 늘리는 방부제 역할을 한다."], a: 2, e: "정답: ③\n평가: 미생물을 이용해 생산된 레그헤모글로빈은 육류 특유의 핏물과 철분 맛을 완벽히 재현합니다." },
            { wk: "4주차", title: "대체단백질 산업의 이해", q: "글로벌 대체단백질 시장의 거시적 동향에 대한 설명으로 옳은 것은?", o: ["2024년부터 2034년까지 시장 규모가 약 10배 성장할 것으로 예측된다.", "연평균 성장률(CAGR)은 약 13.9%로 파괴적인 성장 모멘텀을 보인다.", "기후 위기에 대응하는 저탄소 기술은 현재 기업의 선택적 영역이다.", "글로벌 식량 안보를 위한 공공 투자 목표액의 약 50%가 이미 조달되었다."], a: 1, e: "정답: ②\n평가: 연평균 성장률 약 13.9%로 파괴적인 성장 모멘텀을 보입니다." },
            { wk: "4주차", title: "대체단백질 산업의 이해", q: "'목적 있는 가공(Purposeful Processing)'의 관점에서 대체육 가공의 긍정적 역할은?", o: ["식물성 원료에 포함된 소화 방해 물질인 '항영양소' 제거", "가공 단계를 높여 정크푸드와 동일하게 만드는 것", "원가 절감을 위해 화학 보존제를 다량 투입하는 것", "식물의 세포벽을 더 단단하게 만들어 소화를 억제하는 것"], a: 0, e: "정답: ①\n평가: 가공을 통해 항영양소를 제거하고 아미노산의 체내 소화율을 극대화하는 것이 목적입니다." },
            { wk: "4주차", title: "대체단백질 산업의 이해", q: "미래 전략으로 제시된 '하이브리드 패러다임(The Hybrid Future)'의 본질로 가장 적절한 것은?", o: ["비용 절감을 위해 곤충 단백질만을 100% 사용하여 제품을 생산한다.", "식물성 고기의 경제성과 배양/발효 기술의 풍미 구현력을 상호 보완적으로 융합한다.", "전통 육류와 대체육을 반반 섞어서 판매하는 전략이다.", "기술 개발을 중단하고 전통적인 식물성 고기 제조 방식으로 회귀하는 것이다."], a: 1, e: "정답: ②\n평가: 식물성의 볼륨과 경제성에 배양/발효 기술의 맛과 식감을 더해 규제와 비용 문제를 해결합니다." },

            // [5주차] (9문항)
            { wk: "5주차", title: "식물성 단백질과 대체육 기술", q: "대체육에서 헴(Heme) 단백질의 공학적 역할이 아닌 것은?", o: ["조리 시 철분 향과 피의 맛을 구현하여 육류 특유의 풍미를 제공한다.", "가열 시 아미노산 등과 반응하여 마이야르 반응을 강력하게 촉진시킨다.", "3차원 네트워크 그물을 형성하여 식물성 지방이 녹아내리지 않게 가둔다.", "수천 가지의 고기 휘발성 향미 화합물을 생성하는 화학적 촉매제로 작용한다."], a: 2, e: "정답: ③\n평가: 대체육의 영혼이라 불리는 헴 성분의 감각적, 화학적 기능을 정확히 알고 있는지 평가합니다." },
            { wk: "5주차", title: "식물성 단백질과 대체육 기술", q: "올레오겔(Oleogel) 기술을 대체육에 적용했을 때 얻을 수 있는 효과는?", o: ["식물성 단백질의 색상을 붉게 변화시켜 시각적인 출혈 효과를 극대화한다.", "액체 식물성 오일을 고체 네트워크에 가두어 조리 시 육즙을 서서히 방출한다.", "단백질 간의 결합력을 높여 고기의 섬유상 조직이 더 단단하게 유지되도록 한다.", "미생물을 이용해 동물 세포를 직접 배양함으로써 실제 지방 조직을 생성한다."], a: 1, e: "정답: ②\n평가: 식물성 지방의 낮은 용융점 문제를 해결하기 위한 유화 공학적 해결책을 이해합니다." },
            { wk: "5주차", title: "식물성 단백질과 대체육 기술", q: "미래 대체육의 최종 진화 형태로 제시된 '하이브리드 육류(Hybrid Meat)'의 구성 요소가 아닌 것은?", o: ["대량 생산의 규모와 경제성을 담당하는 식물성 단백질 매트릭스", "실제 육류와 똑같은 지방 질감과 질감을 구현하는 배양된 동물 세포", "전통적인 도축 방식을 통해 얻은 실제 가축의 근육 조직 일부분", "정밀 발효 기술을 통해 생산된 풍미 촉매제(헴 단백질 및 효소)"], a: 2, e: "정답: ③\n평가: 서로 다른 공학 기술들의 융합을 통해 육류 등가성을 달성하는 하이브리드 전략을 이해합니다." },
            { wk: "5주차", title: "식물성 단백질과 대체육 기술", q: "식물성 대체육 개발의 핵심 방법론인 '역설계(Reverse Engineering)'에 대한 설명으로 옳은 것은?", o: ["식물성 원료의 외형만을 시각적으로 모방하여 제품을 성형하는 기술이다.", "실제 육류의 분자 구조와 물리적 특성을 분석한 후 식물성 원료로 재현하는 기법이다.", "전통적인 축산업의 생산 방식을 개선하여 가축의 사육 효율을 높이는 공정이다.", "유전자 조작을 통해 식물에서 직접 동물의 근육 조직을 재배하는 농업 기술이다."], a: 1, e: "정답: ②\n평가: 역설계의 공학적 정의와 대체육 개발에의 적용 원리를 정확히 알고 있는지 평가합니다." },
            { wk: "5주차", title: "식물성 단백질과 대체육 기술", q: "건식 분류(Dry Fractionation) 공정의 특징 중 옳지 않은 것은?", o: ["물과 화학 용매를 사용하지 않아 폐수 발생이 거의 없는 친환경적 방식이다.", "단백질이 화학적 스트레스를 받지 않아 천연 상태(Native state)가 보존된다.", "습식 추출 방식에 비해 단백질의 순도를 90% 이상으로 높이기에 유리하다.", "입자의 질량과 공기 역학적 특성 차이를 이용한 원심력 분리 원리를 사용한다."], a: 2, e: "정답: ③\n평가: 건식 분류의 물리적 원리와 습식 추출 대비 장단점을 비교 분석할 수 있는지 평가합니다." },
            { wk: "5주차", title: "식물성 단백질과 대체육 기술", q: "습식 추출에서 '등전점(Isoelectric Point)' 원리를 이용하는 목적은 무엇인가?", o: ["단백질 분자의 전기적 전하를 상실시켜 선택적으로 응집 및 침전시키기 위함이다.", "단백질의 열변성을 유도하여 고기 특유의 쫄깃한 식감을 미리 형성하기 위함이다.", "용액의 알칼리 농도를 높여 단백질이 물에 최대한 잘 녹도록 유도하기 위함이다.", "추출된 단백질 분말의 수분을 급격히 제거하여 저장 기간을 늘리기 위함이다."], a: 0, e: "정답: ①\n평가: 고순도 단백질 추출의 핵심 화학적 원리인 등전점 제어 기술을 이해하고 있는지 평가합니다." },
            { wk: "5주차", title: "식물성 단백질과 대체육 기술", q: "단백질 조직화(Texturization) 과정 중 '구상 단백질(Globular Protein)'의 변화에 대한 설명으로 옳은 것은?", o: ["동그랗게 뭉쳐진 단백질 사슬을 유지하여 부드러운 푸딩 같은 식감을 만든다.", "전단력을 가해 뭉쳐진 사슬을 풀고(Unfolding) 일정한 방향으로 정렬시킨다.", "단백질 사슬을 불규칙하게 끊어내어 입안에서 쉽게 부서지는 성질을 부여한다.", "화학적 용매를 추가하여 단백질 사슬의 길이를 짧게 축소시키는 과정이다."], a: 1, e: "정답: ②\n평가: 식물성 단백질이 육류의 섬유상 구조로 변화하는 물리적 변형 과정을 이해하고 있는지 평가합니다." },
            { wk: "5주차", title: "식물성 단백질과 대체육 기술", q: "고수분 압출 성형(HME)을 통해 생산하기에 가장 적합한 대체육 형태는?", o: ["햄버거 패티에 주로 사용되는 다공성 스펀지 구조의 다짐육 원료", "수분 함량이 35% 미만인 바삭하고 메마른 형태의 육포형 제품", "닭가슴살과 같이 결이 촘촘하고 치밀한 섬유상을 가진 통고기 덩어리", "마블링 조직이 복잡하게 얽혀 있는 프리미엄 스테이크 부위 제품"], a: 2, e: "정답: ③\n평가: 압출 성형 방식에 따른 최종 제품의 구조적 특징을 구분할 수 있는지 평가합니다." },
            { wk: "5주차", title: "식물성 단백질과 대체육 기술", q: "전단 세포 기술(Shear Cell)이 기존 압출 성형 방식에 비해 갖는 공학적 이점은?", o: ["기계적 회전력을 이용하여 압출 방식보다 훨씬 빠른 속도로 대량 생산이 가능하다.", "압출 성형의 두께 제약 한계를 극복하여 두툼한 계층적 섬유 구조 구현이 가능하다.", "3D 프린팅보다 정밀한 마이크로미터 단위의 마블링 배치가 가능하다는 점이다.", "열 에너지를 전혀 사용하지 않고도 단백질의 조직화를 완벽하게 수행할 수 있다."], a: 1, e: "정답: ②\n평가: 차세대 조직화 기술인 전단 세포 기술의 차별화된 성능을 이해하고 있는지 평가합니다." },

            // [6주차] (9문항)
            { wk: "6주차", title: "배양육의 과학과 산업화", q: "다음 중 배양육을 생산하기 위한 4대 핵심 요소에 해당하지 않는 것은 무엇인가?", o: ["근육 조직으로 분화할 수 있는 능력을 지닌 줄기세포", "세포 분열과 성장에 필요한 명령을 내리는 호르몬 조절기", "동물의 체내 환경을 복제하여 온도와 산소를 제어하는 배양기", "세포가 부착되어 3차원 근섬유 구조를 형성하도록 돕는 지지체"], a: 1, e: "정답: ②\n평가: 4대 핵심 요소는 세포, 배양액, 배양기, 지지체이며 호르몬 조절기는 해당하지 않습니다." },
            { wk: "6주차", title: "배양육의 과학과 산업화", q: "배양육 상용화를 위한 기술경제성 평가(TEA) 분석 결과, 운영 비용(OpEx)을 높여 가격 경쟁력 확보를 가로막는 가장 큰 병목(Bottleneck) 요인은 무엇인가?", o: ["바이오리액터를 식품 등급으로 전환하는 데 드는 초기 강철 자재 비용", "공조 시스템을 무균 상태로 유지하기 위한 필터 교체 인건비", "배양액 구성 성분 중, 알부민을 비롯한 재조합 단백질 및 성장 인자의 높은 원가", "완성된 근육 조직을 분쇄육 형태로 가공하고 포장하는 물류 비용"], a: 2, e: "정답: ③\n평가: 운영 비용의 대부분을 차지하는 핵심 병목은 배양액 내 성장 인자와 알부민의 높은 단가입니다." },
            { wk: "6주차", title: "배양육의 과학과 산업화", q: "배양 생물학계에서 오랫동안 사용해 온 '소 태아 혈청(FBS)'이 안고 있는 윤리적 딜레마를 해결하기 위해, 현재 산업계가 다각도로 모색하고 있는 기술적 대안으로 가장 적절한 것은?", o: ["식용 곤충의 추출물을 사용하여 동물성 혈청의 농도를 2배로 농축하는 기법", "동물을 희생시키지 않고 원하는 단백질 성분만 생산하는 미생물 정밀 발효 기술 및 식물성 기반 배지 개발", "배양기의 온도를 체온보다 낮추어 세포가 혈청 없이도 광합성을 통해 생존하도록 유도하는 변이 기술", "소 대신 번식력이 강한 조류(닭)의 태아 혈청으로 전면 교체하여 생산 단가를 낮추는 방법"], a: 1, e: "정답: ②\n평가: 동물성 원료를 완전히 배제하는 무혈청 배지(Serum-free Media) 개발이 기술적 타협점입니다." },
            { wk: "6주차", title: "배양육의 과학과 산업화", q: "배양육이 기존 축산업 대비 토지와 물 사용량을 줄임에도 불구하고, 전 생애주기 관점(LCA)에서 진정한 친환경 식량으로 평가받기 위해 해결해야 할 '에너지 캐치(Energy Catch)' 현상의 핵심은 무엇인가?", o: ["세포의 근섬유 분화 과정에서 메탄가스가 전통 축산보다 더 많이 배출된다.", "거대한 배양기의 대사열 통제 및 무균 공조 시스템 가동 등에 막대한 전력 에너지가 소모된다.", "배양액을 생산하기 위해 기존 사료용 곡물 재배보다 더 넓은 농경지가 필요하다.", "폐기되는 지지체(스캐폴드)가 자연 상태에서 분해되지 않아 미세플라스틱 오염을 유발한다."], a: 1, e: "정답: ②\n평가: 거대한 기계가 동물의 체내 활동을 대신하면서 소모되는 막대한 전력 에너지를 재생에너지로 조달해야 합니다." },
            { wk: "6주차", title: "배양육의 과학과 산업화", q: "지지체(Scaffold)를 설계할 때 상용화를 위해 반드시 충족해야 하는 가장 핵심적인 전제 조건은 무엇인가?", o: ["세포의 빠른 증식을 위해 고온에서 쉽게 녹아내리는 소재여야 한다.", "세포 부착을 막기 위해 표면적이 최소화된 매끄러운 단면 구조를 가져야 한다.", "최종 결과물 섭취 시 함께 먹어야 하므로 인체에 무해하고 식용 가능한(Edible) 소재여야 한다.", "강도를 높이기 위해 인체에서 분해되지 않는 의료용 플라스틱 폴리머로 제작되어야 한다."], a: 2, e: "정답: ③\n평가: 지지체는 요리하여 먹을 때 분리해 낼 수 없으므로 인체에 무해하고 식용 가능한(Edible) 소재여야 합니다." },
            { wk: "6주차", title: "배양육의 과학과 산업화", q: "배양육의 대량 생산을 위해 배치(Batch) 공정 대신 파이프라인을 통한 연속 공정(Continuous Process)을 도입할 때 얻을 수 있는 공학적 접근의 가장 큰 이점은 무엇인가?", o: ["배양액에 들어가는 성장 인자의 가격을 획기적으로 낮출 수 있다.", "기계를 끄고 세척 및 살균하는 빈도를 축소하여 공장 가동 시간을 극대화할 수 있다.", "배양기 내부의 온도를 37도 이하로 낮추어 유틸리티 전력 소모를 차단할 수 있다.", "살아있는 가축에게서 세포를 채취하는 초기 분리 단계를 생략할 수 있다."], a: 1, e: "정답: ②\n평가: 연속 공정은 세척 및 살균 빈도를 줄여 공장 가동 시간을 극대화하는 해결책입니다." },
            { wk: "6주차", title: "배양육의 과학과 산업화", q: "배양육 생산 공정 중, 세포가 입체적인 고기의 형태(근육 다발)를 갖추기 위해 스캐폴드(지지체)에 달라붙어 스스로 형태와 성질을 변화시키는 생물학적 과정을 일컫는 전문용어는 무엇인가?", o: ["분리 (Isolation)", "분화 (Differentiation)", "수확 (Harvest)", "배양 (Cultivation)"], a: 1, e: "정답: ②\n평가: 숫자가 늘어난 세포들이 특정한 기능과 3차원적 근섬유 형태로 구조화되는 성숙 과정을 '분화(Differentiation)'라 합니다." },
            { wk: "6주차", title: "배양육의 과학과 산업화", q: "배양육 생산 과정에서 항생제를 거의 사용하지 않을 수 있는 대신, 외부 오염을 철저히 막아야 하는 고난도 공학적 과제가 발생합니다. 이와 관련된 필수 안전성 검증 시스템은 무엇인가?", o: ["세포주 관리 및 이력 추적 시스템 (HACCP 고도화)", "철저한 환경 통제를 기반으로 한 무균 운영 (Sterile Operations) 시스템", "배양액 내 신규 첨가물(효모 부산물 등)의 인체 무해성 입증", "유전자 조작 미생물(GMO) 완전 폐기 프로토콜"], a: 1, e: "정답: ②\n평가: 외부 오염원을 초기부터 완벽히 차단하는 인프라인 '무균 운영(Sterile Operations)' 시스템이 필수적입니다." },
            { wk: "6주차", title: "배양육의 과학과 산업화", q: "배양육이 일상적인 대안 식량으로 자리 잡기 위해 극복해야 하는 복합적 과제들을 융합적으로 설명한 개념으로, '과학, 경제, 사회'의 톱니바퀴가 완벽하게 맞물려야 함을 상징하는 용어는 무엇인가?", o: ["스케일업 역설 (Scale-up Paradox)", "개념 증명 (Proof of Concept)", "트릴레마 (Trilemma)", "그리드 패리티 (Grid Parity)"], a: 2, e: "정답: ③\n평가: 과학, 경제, 사회 세 가지 요소가 얽혀 있는 복합적 과제를 '트릴레마(Trilemma)'라 부릅니다." },

            // [7주차] (9문항)
            { wk: "7주차", title: "스마트농업과 디지털 전환", q: "데이터 기반의 정밀 농업(Precision Agriculture)이 작동하는 4단계 순환 주기(Cycle)가 바르게 나열된 것은 무엇입니까?", o: ["처방 → 결과 분석 → 모니터링 → 농작업 수행", "모니터링 → 처방 → 농작업 수행 → 결과 분석", "모니터링 → 농작업 수행 → 처방 → 결과 분석", "결과 분석 → 모니터링 → 처방 → 농작업 수행"], a: 1, e: "정답: ②\n평가: 모니터링 → 처방 → 농작업 수행 → 결과 분석의 순서로 순환합니다." },
            { wk: "7주차", title: "스마트농업과 디지털 전환", q: "정밀 농업 플랫폼에서 자원 투입의 최소화를 달성하기 위해, 밭 전체에 일괄적으로 비료를 살포하지 않고 조건에 따라 투입량을 위치별로 다르게 조절하는 공학적 기술은 무엇입니까?", o: ["증산작용 촉진 기술", "다중 분광 카메라 예찰 기술", "변량 투입 기술 (Variable Rate Technology)", "순환형 시스템 구축 기술"], a: 2, e: "정답: ③\n평가: 위치나 조건에 따라 자원의 투입량을 유동적으로 조절하는 기술을 변량 투입 기술이라 합니다." },
            { wk: "7주차", title: "스마트농업과 디지털 전환", q: "스마트농업을 통해 구현하고자 하는 '미래 식량 시스템'의 궁극적 지향점을 가장 객관적으로 설명한 것은 무엇입니까?", o: ["기상 이변을 피하기 위해 전 세계 모든 노지 농업을 폐기하고 100% 시설 스마트팜으로 전환하는 것이다.", "초기 자본 문제를 무시하더라도 생산성을 늘리기 위해 화학 비료의 투입량을 관행 농업 대비 2배 이상 상향하는 것이다.", "자원 투입의 최소화와 산출의 극대화를 동시에 달성하여 경제성과 환경적 지속가능성이 내재화된 다목적 최적화를 실현하는 것이다.", "인간의 직관적 경험을 완전히 배제하고 오직 룩백 창 조절에만 의존하여 수확량을 측정하는 것이다."], a: 2, e: "정답: ③\n평가: 자원 투입 최소화와 산출 극대화를 동시에 달성하는 지속가능성 내재화가 지향점입니다." },
            { wk: "7주차", title: "스마트농업과 디지털 전환", q: "스마트팜의 물리적 작동 구조를 인체 기관에 비유했을 때, 역할이 바르게 짝지어지지 않은 것은 무엇입니까?", o: ["감각 기관 - 센서: 온도, 습도, 토양 상태 등 환경 변수 실시간 감지", "신경망 - 게이트웨이: 센서 데이터를 중앙 시스템으로 전송", "두뇌 - 액추에이터: 수집된 데이터를 바탕으로 실시간 복잡한 연산과 의사결정 수행", "근육 - 액추에이터: 제어 신호를 받아 자동 관수나 환기팬 작동 등 물리적 조치 실행"], a: 2, e: "정답: ③\n평가: 두뇌 역할을 하는 것은 클라우드 플랫폼의 AI이며, 액추에이터는 근육(실행)의 역할을 합니다." },
            { wk: "7주차", title: "스마트농업과 디지털 전환", q: "첨단 수경재배 환경에서 농작물에 공급되는 비료 성분의 농도가 적절한지 파악하기 위해 필수적으로 측정해야 하는 지표는 무엇입니까?", o: ["일사량", "상대습도", "이산화탄소(CO2) 농도", "전기전도도 (EC)"], a: 3, e: "정답: ④\n평가: 배양액에 비료 성분이 얼마나 짙게 녹아 있는지 파악하기 위해 전기전도도(EC)를 측정합니다." },
            { wk: "7주차", title: "스마트농업과 디지털 전환", q: "관행 농업에서 디지털 농업으로의 패러다임 전환에 대한 설명으로 가장 적절하지 않은 것은 무엇입니까?", o: ["핵심 투입 요소가 노동과 직관에서 데이터와 D·N·A로 전환되었다.", "의사 결정 방식이 농업인의 과거 경험에서 인공지능 기반 실시간 분석으로 변경되었다.", "농업의 최종 목표가 단순 수확량 증대에서 시스템 최적화 및 지속가능성으로 재설정되었다.", "농가 현장의 모든 의사결정을 자동화하여 인간의 개입을 완전히 배제하는 것이 유일한 목적이다."], a: 3, e: "정답: ④\n평가: 인간의 개입을 최소화하는 것은 맞으나 완전한 배제가 유일한 목적은 아닙니다." },
            { wk: "7주차", title: "스마트농업과 디지털 전환", q: "스마트팜 생태계를 구성하는 D·N·A 융합에 대한 설명으로 올바른 것은 무엇입니까?", o: ["데이터는 주로 외부 기상청에서만 수집되어 시스템에 수동으로 입력되는 정보이다.", "네트워크는 수집된 데이터를 외부와 단절시켜 사이버 보안을 유지하는 독립 저장 공간이다.", "인공지능(AI)은 방대한 빅데이터를 학습하여 상황을 스스로 판단하고 제어하는 두뇌 역할을 수행한다.", "사물인터넷(IoT)은 유선 통신망만을 이용하여 기기 간 한 방향으로 데이터를 전송하는 기술이다."], a: 2, e: "정답: ③\n평가: AI는 중앙으로 모인 빅데이터를 학습하여 상황을 스스로 판단하고 제어하는 두뇌 역할을 합니다." },
            { wk: "7주차", title: "스마트농업과 디지털 전환", q: "공간과 목적에 따른 스마트팜의 유형과 그 특징이 바르게 연결된 것은 무엇입니까?", o: ["시설 스마트팜 - 개방된 농지에 통신 드론과 자율주행 농기계 투입", "수경재배 스마트팜 - 흙 없이 작물 생장에 필요한 미네랄을 녹인 영양액만으로 정밀 재배", "도시 스마트팜 - 가축의 생체 데이터와 축사 환경을 실시간 모니터링", "축산 스마트팜 - 도심의 지하 공간에 인공광을 이용하여 약용 작물 재배"], a: 1, e: "정답: ②\n평가: 수경재배 스마트팜은 흙 없이 배양액의 pH와 EC를 조절하여 작물을 기르는 방식입니다." },
            { wk: "7주차", title: "스마트농업과 디지털 전환", q: "스마트팜의 인공지능(AI)이 머신러닝을 기반으로 수행하는 주요 판단 역할과 거리가 먼 것은 무엇입니까?", o: ["룩백 창 조절 없이 과거 데이터에 의존하는 단순 수동 제어 알고리즘 운영", "식물의 유전적 특성과 환경 조건을 결합하여 예상 수확량과 최적의 수확 시기를 예측하는 생육 모델링", "영상 데이터베이스와 대기 환경 데이터를 융합하여 질병이나 해충의 발생 징후를 조기에 발견하는 사전 예찰", "인간의 실시간 개입 없이 스스로 최적의 변숫값을 역산하여 설비를 조작하는 자율 제어"], a: 0, e: "정답: ①\n평가: 머신러닝 알고리즘은 단순 수동 제어가 아니라 룩백 창을 유연하게 조절하며 자율 루프를 운영합니다." }
        ];

        /* ===== 상태 변수 ===== */
        var picked = {};
        var pool = [];
        var pos = 0;
        var weekFilter = 'all';
        var finished = false;

        var CIRCLED = ['①','②','③','④','⑤'];
        var $ = function (id) { return document.getElementById(id); };

        /* ===== 주차 필터 구성 ===== */
        function buildPool() {
            pool = [];
            for (var i = 0; i < ALL.length; i++) {
                if (weekFilter === 'all' || ALL[i].wk === weekFilter + '주차') {
                    pool.push(i);
                }
            }
            pos = 0;
        }

        function buildFilters() {
            var box = $('filters');
            box.innerHTML = '';
            var weeks = ['all','1','2','3','4','5','6','7'];
            weeks.forEach(function (w) {
                var b = document.createElement('button');
                b.type = 'button';
                b.className = 'text-xs font-bold px-3 py-1.5 rounded-full border transition cursor-pointer ' + 
                    (weekFilter === w ? 'bg-emerald-500 border-emerald-500 text-slate-950 shadow-sm' : 'bg-slate-700/60 border-slate-600 text-slate-300 hover:bg-slate-700');
                b.textContent = (w === 'all' ? '전체 (63)' : w + '주차');
                b.addEventListener('click', function () { setFilter(w); });
                box.appendChild(b);
            });
        }

        function setFilter(w) {
            weekFilter = w; 
            finished = false;
            picked = {};
            buildPool(); 
            buildFilters(); 
            render();
        }

        function qIndex() { return pool[pos]; }

        /* ===== 렌더링 ===== */
        function render() {
            if (finished) return showSummary();
            if (!pool.length) return;
            var gi = qIndex(), q = ALL[gi];

            $('quiz-area').classList.remove('hidden');
            $('summary').classList.add('hidden');
            $('nav-footer').classList.remove('hidden');

            $('progress-text').textContent = (pos + 1) + ' / ' + pool.length;
            $('progress-bar').style.width = ((pos + 1) / pool.length * 100) + '%';

            $('week-badge').textContent = q.wk + ' · ' + q.title;
            $('question-text').textContent = q.q;

            var box = $('options-container');
            box.innerHTML = '';
            var chosen = (picked[gi] === undefined) ? null : picked[gi];

            q.o.forEach(function (text, i) {
                var btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'w-full text-left flex items-start gap-3 p-3.5 rounded-2xl border text-xs sm:text-sm font-medium transition cursor-pointer ';
                
                if (chosen === null) {
                    btn.className += 'bg-slate-700/40 border-slate-600 text-slate-200 hover:bg-slate-700 hover:border-slate-500';
                } else {
                    btn.disabled = true;
                    if (i === q.a) {
                        btn.className += 'bg-emerald-950/60 border-emerald-500 text-emerald-200 font-bold';
                    } else if (i === chosen) {
                        btn.className += 'bg-rose-950/60 border-rose-500 text-rose-200 font-bold';
                    } else {
                        btn.className += 'bg-slate-800/40 border-slate-700 text-slate-500 opacity-40';
                    }
                }

                var num = document.createElement('span');
                num.className = 'flex-none w-5 h-5 rounded-full bg-slate-700 text-slate-300 text-[11px] font-bold flex items-center justify-center mt-0.5';
                num.textContent = (i + 1);

                var tx = document.createElement('span');
                tx.className = 'flex-1 leading-relaxed';
                tx.textContent = text;

                btn.appendChild(num);
                btn.appendChild(tx);
                btn.addEventListener('click', function () { choose(i); });
                box.appendChild(btn);
            });

            if (chosen === null) {
                $('explanation-box').classList.add('hidden');
            } else {
                var ok = chosen === q.a;
                var st = $('result-status');
                st.textContent = ok ? '🎉 정답입니다!' : '❌ 오답입니다. 정답은 ' + CIRCLED[q.a] + ' 입니다.';
                st.className = 'font-bold text-xs mb-1 ' + (ok ? 'text-emerald-400' : 'text-rose-400');
                $('explanation-text').textContent = q.e;
                $('explanation-box').classList.remove('hidden');
            }

            $('prev-btn').disabled = (pos === 0);
            $('next-btn').textContent = (pos === pool.length - 1) ? '결과 보기' : '다음';
            $('score-display').textContent = '맞은 갯수: ' + score() + ' / ' + answered();
        }

        function score() {
            var s = 0;
            for (var k in picked) if (picked[k] === ALL[k].a) s++;
            return s;
        }
        function answered() { var n = 0; for (var k in picked) n++; return n; }

        function choose(i) {
            var gi = qIndex();
            if (picked[gi] !== undefined) return;
            picked[gi] = i;
            render();
        }

        function go(step) {
            var n = pos + step;
            if (n < 0) return;
            if (n >= pool.length) { finished = true; return render(); }
            pos = n; render();
        }

        /* ===== 결과 화면 ===== */
        function showSummary() {
            $('quiz-area').classList.add('hidden');
            $('nav-footer').classList.add('hidden');
            $('summary').classList.remove('hidden');

            var total = pool.length;
            var s = 0;
            for (var i = 0; i < pool.length; i++) {
                if (picked[pool[i]] === ALL[pool[i]].a) s++;
            }
            var rate = Math.round(s / total * 100);
            
            $('summary-score').textContent = s + ' / ' + total;
            $('summary-text').textContent = '정답률 ' + rate + '% · ' + (rate >= 80 ? '아주 훌륭합니다!' : '조금 더 복습해 볼까요?');

            var wrong = [];
            for (var j = 0; j < pool.length; j++) {
                if (picked[pool[j]] !== ALL[pool[j]].a) wrong.push(pool[j]);
            }

            var wrongList = $('wrong-list');
            wrongList.innerHTML = '';
            if (wrong.length > 0) {
                $('wrong-wrap').classList.remove('hidden');
                wrong.forEach(function (gi) {
                    var item = document.createElement('button');
                    item.type = 'button';
                    item.className = 'w-full text-left text-xs bg-slate-900/80 border border-slate-700 p-2.5 rounded-xl text-slate-300 hover:bg-slate-900 transition cursor-pointer flex justify-between items-center';
                    item.innerHTML = '<span class="truncate pr-2"><b>[' + ALL[gi].wk + ']</b> ' + ALL[gi].q + '</span><span class="text-rose-400 font-bold whitespace-nowrap">정답: ' + CIRCLED[ALL[gi].a] + '</span>';
                    item.addEventListener('click', function () {
                        finished = false;
                        pos = pool.indexOf(gi);
                        render();
                    });
                    wrongList.appendChild(item);
                });
            } else {
                $('wrong-wrap').classList.add('hidden');
            }

            $('progress-text').textContent = total + ' / ' + total;
            $('progress-bar').style.width = '100%';
        }

        /* ===== 이벤트 연결 ===== */
        $('prev-btn').addEventListener('click', function () { go(-1); });
        $('next-btn').addEventListener('click', function () { go(1); });
        $('restart-btn').addEventListener('click', function () {
            picked = {}; finished = false; pos = 0; render();
        });

        // 초기 실행
        buildPool();
        buildFilters();
        render();
    </script>
</body>
</html>
